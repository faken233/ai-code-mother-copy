spring:
  application:
    name: yu-ai-code-mother-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yu_ai_code_mother
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600 # 缓存过期时间（秒）
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
#      strict-json-schema: true
#      response-format: json_object
      max-tokens: 8192
      temperature: 0.7
      top-p: 1.0
      timeout: 60s
      log-requests: false
      log-responses: false
      max-retries: 3
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      max-tokens: 8192
      temperature: 0.7
      top-p: 1.0
      timeout: 60s
      log-requests: false
      log-responses: false
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      top-p: 1.0
      timeout: 300s
      log-requests: false
      log-responses: false
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <Your API Key>
      model-name: qwen-turbo
      max-tokens: 1000
      temperature: 0.1
      top-p: 1.0
      timeout: 30s
      log-requests: false
      log-responses: false
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your-custom-domain.com
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-shanghai
    bucket: your-bucket-name
# Pexels 图片搜索配置
pexels:
  api-key: <Your API Key>
# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: wan2.2-t2i-flash
# 日志配置
logging:
  level:
    # 开启 LangChain4j 的请求/响应日志（调试时使用）
    dev.langchain4j: DEBUG
    # 如果使用 OkHttp 客户端
    okhttp3.logging: DEBUG
# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
# AI 生成任务队列配置
gen-task:
  # 最大并发执行任务数
  max-concurrent: 3
  # 轮询任务队列间隔（毫秒）
  poll-interval: 2000
  # 任务执行超时时间（分钟）
  timeout-minutes: 10
  # 上游瞬时错误最大重试次数
  max-retries: 3
  # 重试基础延迟（毫秒），指数退避
  retry-base-delay-ms: 3000
# Docker 代码沙箱配置
sandbox:
  # 是否启用沙箱（默认开启 docker 模式，无 docker 环境时可改为 false 降级本地直写）
  enabled: true
  # 沙箱镜像名
  image: code-sandbox:latest
  # 工作区根目录（宿主机）
  workspace-root: ${user.dir}/tmp/code_output
  # 预览端口范围起（映射容器内 node 文件服务 8080）
  preview-port-range-start: 18080
  # 预览端口范围内偏移上限
  preview-port-range-size: 1000
  # 沙箱容器内 HTTP 服务（node 文件服务）端口
  container-port: 8080
  # 沙箱容器内 Spring Boot 后端端口
  container-backend-port: 8081
  # 映射到宿主机的后端端口范围起（反代到容器内后端）
  backend-port-range-start: 19080
  # 主服务访问沙箱容器的地址（本地直跑=localhost，compose 内=host.docker.internal）
  host: localhost
  # 沙箱专用 MySQL 主机（供沙箱内后端连接，与平台物理隔离）
  mysql-host: host.docker.internal
  mysql-port: 3307
  # 沙箱专用 Redis 主机（供沙箱内后端连接，与平台物理隔离）
  redis-host: host.docker.internal
  redis-port: 6380
  # MySQL root 用户
  mysql-user: root
  # MySQL root 密码（仅用于沙箱内建库）
  mysql-password: 123456